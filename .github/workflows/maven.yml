# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: Review-service
          MYSQL_ROOT_PASSWORD: ${{ secrets.REVIEW_DB_ROOT_PASS }}
          MYSQL_USER: ${{ secrets.REVIEW_DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.REVEW_DB_PASS }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        SPRING_DATASOURCE_URL: jdbc:mysql://review-db:3306/Review-service #URL to the created MySQL database schema.
        SPRING_DATASOURCE_USERNAME: ${{ secrets.REVIEW_DB_USER }} #Username for the database, needs to be the name as the databases chosen user
        SPRING_DATASOURCE_PASSWORD: ${{ secrets.REVIEW_DB_PASS }}

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
