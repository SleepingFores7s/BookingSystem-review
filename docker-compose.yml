services:

  booking-review:
    build: .
    container_name: booking-system-review
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://review-db:3306/booking_review
      SPRING_DATASOURCE_USERNAME: review_user
      SPRING_DATASOURCE_PASSWORD: review_password
    depends_on:
      review-db:
        condition: service_healthy

  review-db:
    image: mysql:8
    container_name: booking-system-review-db
    environment:
      MYSQL_DATABASE: booking_review
      MYSQL_USER: review_user
      MYSQL_PASSWORD: review_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - review-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  review-db-data: