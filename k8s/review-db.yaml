apiVersion: apps/v1
kind: Deployment
metadata: #Resource Name
  name: review-db
spec:
  replicas: 1 #How many Copies that exists
  selector:
    matchLabels:
      app: review-db
  template: #How the POD should look/be setup
    metadata:
      labels:
        app: review-db
    spec:
      containers:
        - name: mysql #Container name
          image: mysql:8 #what MySQL image to use
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: review_password
            - name: MYSQL_DATABASE
              value: booking_review
            - name: MYSQL_USER
              value: review_user
            - name: MYSQL_PASSWORD
              value: review_password
          ports:
            - containerPort: 3306


---


apiVersion: v1
kind: Service
metadata:
  name: review-db
spec:
  selector:
    app: review-db
  ports:
    - port: 3306
      targetPort: 3306